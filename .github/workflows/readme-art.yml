name: readme-art

# Redraws assets/*.svg from real GitHub activity: every night, on demand, and
# whenever the generator changes. Nothing is installed; the script is plain Node.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/readme-art.mjs", "assets/portrait.txt"]

permissions:
  contents: write

concurrency:
  group: readme-art
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Draw
        run: node scripts/readme-art.mjs --user "${{ github.repository_owner }}"
        env:
          # GITHUB_TOKEN sees public contributions. For private ones too, add a
          # classic PAT with read:user as the secret README_ART_TOKEN.
          GH_TOKEN: ${{ secrets.README_ART_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: redraw README art"
          git push
