<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 160" width="960" height="160" role="img" aria-label="Yehuda Briskman: Full-Stack Engineer, Technical Lead, Product Builder">
  <title>Yehuda Briskman: Full-Stack Engineer, Technical Lead, Product Builder</title>
  <style>
  @keyframes type{to{width:var(--w)}}
  @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
  @keyframes scan{from{transform:translateY(-8px);opacity:0}8%{opacity:.9}to{transform:translateY(var(--h));opacity:0}}

  text{font-family:ui-monospace,'SF Mono','JetBrains Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.rise,.pop,.grow,.line,.fade{opacity:1!important;transform:none!important}.type-clip{width:100%!important}}
@keyframes role0{0%,0.00%{width:0}16.67%,28.13%{width:var(--w)}33.33%,100%{width:0}}@keyframes role1{0%,33.33%{width:0}50.00%,61.46%{width:var(--w)}66.67%,100%{width:0}}@keyframes role2{0%,66.67%{width:0}83.33%,94.79%{width:var(--w)}100.00%,100%{width:var(--w)}}.cursor{animation:blink 1s steps(1) infinite}</style>
  <rect x="0.5" y="0.5" width="959" height="159" rx="12" fill="#0f131b" stroke="#232a38"/>
  <path d="M0.5 12.5a12 12 0 0 1 12-12h935a12 12 0 0 1 12 12V34H0.5z" fill="#141a26"/>
