  <text x="480" y="22" text-anchor="middle" font-size="11.5" fill="#8b95a7">~/yehudabriskman</text><clipPath id="p-hero"><rect class="type-clip" x="334" y="41" width="0" height="25" style="animation:type 1.44s steps(32,end) 0s forwards;--w:294px"/></clipPath>
